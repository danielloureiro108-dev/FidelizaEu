services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* precisam estar no build.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    # Se NÃO for usar o Caddy, troque "expose" por:
    # ports:
    #   - "3000:3000"

  # Proxy reverso com HTTPS automático (Let's Encrypt).
  # A câmera do leitor de QR (getUserMedia) EXIGE HTTPS — por isso o Caddy.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
